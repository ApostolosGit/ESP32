name: Build ESP32 Display2.8 firmware

on:
  push:
    paths:
      - 'Display2.8/Display2.8.ino'
      - '.github/workflows/build-display28.yml'
  workflow_dispatch:

concurrency:
  group: display28-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/pip install --upgrade pip
          .build-venv/bin/pip install platformio esptool==4.8.1
      - name: Set up PlatformIO project
        run: |
          mkdir -p .display28-build/src
          cp Display2.8/Display2.8.ino .display28-build/src/main.cpp
          cp Display2.8/*.h .display28-build/src/
          cat > .display28-build/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32@6.10.0
          board = esp32dev
          framework = arduino
          board_build.flash_mode = dio
          board_build.flash_size = 4MB
          monitor_speed = 115200
          lib_deps =
            moononournation/GFX Library for Arduino@1.4.9
            paulstoffregen/XPT2046_Touchscreen
            knolleary/PubSubClient@2.8
            bblanchon/ArduinoJson@6.21.5
          EOF
      - name: Compile
        run: |
          .build-venv/bin/pio run -d .display28-build
      - name: Create complete flash BIN
        shell: bash
        run: |
          set -euo pipefail
          OUT=".display28-build/.pio/build/esp32dev"
          test -s "$OUT/firmware.bin"
          test -s "$OUT/bootloader.bin"
          test -s "$OUT/partitions.bin"
          cp "$OUT/firmware.bin" Display2.8/Display2.8-app-only.bin
          BOOTAPP=$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)
          test -s "$BOOTAPP"
          .build-venv/bin/python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o Display2.8/Display2.8.bin \
            0x1000 "$OUT/bootloader.bin" \
            0x8000 "$OUT/partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$OUT/firmware.bin"
          test -s Display2.8/Display2.8.bin
          VERSION=$(sed -n 's/^#define FW_VERSION "\(ver[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' Display2.8/Display2.8.ino)
          if [ -n "$VERSION" ]; then
            cp Display2.8/Display2.8.bin "Display2.8/Display2.8-$VERSION.bin"
          fi
          sha256sum Display2.8/*.bin
      - name: Upload BIN artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Display2.8-test-bins
          path: |
            Display2.8/Display2.8.bin
            Display2.8/Display2.8-app-only.bin
            Display2.8/Display2.8-ver*.bin
      - name: Publish BIN next to INO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Display2.8/*.bin
          if ! git diff --cached --quiet; then
            git commit -m "Build Display2.8 bootable firmware binaries"
            git push
          fi
